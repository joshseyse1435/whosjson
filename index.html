<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Who's JSON</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Case file No. 001: Josh Seyse. Six months, all in.">
<meta property="og:title" content="Who's JSON?">
<meta property="og:description" content="Case file No. 001. Six months, all in.">
<meta property="og:image" content="https://whosjson.com/ironman.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime:wght@400;700&family=Permanent+Marker&display=swap">
<style>
/* Layout: one lamp-lit corkboard; evidence pinned and tied with red string; click a card to open its file. */
:root {
  --room: #120e0b;        /* dark office behind the board */
  --cork: #9a6b3f;        /* corkboard */
  --cork-dark: #6e4a2a;
  --paper: #f1ead8;       /* index cards, polaroid frames */
  --manila: #e2c98f;      /* case folders */
  --ink: #1d1a17;         /* typewriter ink */
  --string: #c4161c;      /* red string */
  --stamp: #b3121a;
  --note: #f3d64a;        /* sticky notes */
  --muted: #6b6258;
  --f-type: "Special Elite", "Courier New", Courier, monospace;
  --f-body: "Courier Prime", "Courier New", Courier, monospace;
  --f-hand: "Permanent Marker", "Comic Sans MS", "Bradley Hand", cursive;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--room);
  color: var(--paper);
  font-family: var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 28px;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
  min-height: 100%;
}
.topline {
  width: 100%; max-width: 1400px;
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 20px;
  font-family: var(--f-type); font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #a89a88;
}
.topline b { color: var(--paper); font-weight: normal; }

/* The board */
.frame {
  width: 100%; max-width: 1400px;
  border-radius: 6px;
  padding: 14px;
  background: linear-gradient(145deg, #5a3a22, #3a2414 60%, #2c1b0f);
  box-shadow: 0 30px 80px rgba(0,0,0,.7), inset 0 0 0 2px rgba(255,255,255,.04);
}
.viewport { position: relative; overflow: hidden; border-radius: 2px; }
.board {
  position: absolute; top: 0; left: 0;
  transform-origin: 0 0;
  background-color: var(--cork);
  background-image:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .2  0 0 0 0 .12  0 0 0 0 .05  0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
    radial-gradient(circle at 20% 30%, rgba(255,220,170,.10), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(0,0,0,.18), transparent 45%);
  box-shadow: inset 0 0 120px rgba(40,20,5,.65);
}
/* desk-lamp pool of light */
.lamp {
  position: absolute; inset: 0; pointer-events: none; z-index: 30;
  background: radial-gradient(ellipse 60% 70% at 45% 40%, rgba(255,230,180,.10), transparent 60%),
              radial-gradient(ellipse at center, transparent 55%, rgba(10,5,0,.55) 100%);
}
svg.strings { position: absolute; inset: 0; z-index: 20; pointer-events: none; overflow: visible; }
.strings path { fill: none; stroke: var(--string); stroke-width: 2.2; stroke-linecap: round; filter: drop-shadow(1px 3px 2px rgba(0,0,0,.45)); }
.strings path.faint { stroke-dasharray: 5 6; opacity: .6; }
.strings .pin { fill: #d42a2a; stroke: #6d0b0b; stroke-width: 1; filter: drop-shadow(1px 3px 2px rgba(0,0,0,.5)); }
.strings .pin-hi { fill: rgba(255,255,255,.55); stroke: none; }

/* Pinned items */
.item {
  position: absolute; z-index: 10;
  cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
  transition: box-shadow .15s ease, transform .15s ease;
  box-shadow: 2px 8px 18px rgba(0,0,0,.45);
  color: var(--ink);
  border: 0; padding: 0; text-align: left; font: inherit; background: none;
}
.item:hover { box-shadow: 4px 16px 28px rgba(0,0,0,.55); }
.item.dragging { cursor: grabbing; z-index: 25; box-shadow: 8px 26px 40px rgba(0,0,0,.6); }
.item:focus-visible { outline: 3px dashed var(--note); outline-offset: 6px; }

.polaroid { background: var(--paper); padding: 10px 10px 0; }
.polaroid .photo { width: 100%; aspect-ratio: 3 / 4; overflow: hidden; background: #222; }
.polaroid img { width: 100%; height: 100%; object-fit: cover; display: block; filter: sepia(.18) contrast(1.05) saturate(.9); pointer-events: none; }
.polaroid .cap { font-family: var(--f-hand); font-size: 17px; padding: 8px 2px 10px; line-height: 1.15; }

.exhibit { background: var(--paper); padding: 10px 10px 12px; }
.exhibit .shot {
  aspect-ratio: 4 / 3; background: #0c0c0c; color: #e8e4da;
  display: grid; place-items: center; text-align: center;
  font-family: var(--f-body); font-size: 13px; letter-spacing: .12em; overflow: hidden; position: relative;
}
.exhibit .shot img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; pointer-events: none; }
.exhibit .tag { font-family: var(--f-type); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-top: 8px; display: flex; justify-content: space-between; }
.exhibit .ttl { font-family: var(--f-hand); font-size: 17px; line-height: 1.15; margin-top: 2px; }

.redacted { background: var(--manila); padding: 14px 14px 16px; }
.redacted .tag { font-family: var(--f-type); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: #6b5328; }
.redacted .bar { height: 11px; background: var(--ink); margin-top: 9px; }
.redacted .bar:nth-child(3) { width: 82%; } .redacted .bar:nth-child(4) { width: 64%; } .redacted .bar:nth-child(5) { width: 90%; }
.redacted .stampmark {
  margin-top: 14px; display: inline-block;
  font-family: var(--f-type); font-size: 15px; letter-spacing: .18em; color: var(--stamp);
  border: 2px solid var(--stamp); padding: 3px 8px; transform: rotate(-6deg); opacity: .85;
}

.indexcard {
  background: #fbf8f0; padding: 14px 18px 16px;
  background-image: linear-gradient(transparent 31px, rgba(80,120,200,.25) 32px);
  background-size: 100% 22px; background-position: 0 6px;
}
.indexcard .line1 { font-family: var(--f-type); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--stamp); border-bottom: 2px solid rgba(179,18,26,.5); padding-bottom: 6px; }
.indexcard h1 { font-family: var(--f-type); font-weight: normal; font-size: 34px; line-height: 1; margin: 12px 0 10px; text-wrap: balance; }
.indexcard dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 14px; line-height: 22px; font-variant-numeric: tabular-nums; }
.indexcard dt { color: var(--muted); }
.indexcard dd { margin: 0; }
.indexcard .open { color: var(--stamp); font-weight: 700; }

.note {
  background: var(--note); padding: 16px 14px 18px;
  font-family: var(--f-hand); font-size: 21px; line-height: 1.15; color: #2a2306;
  box-shadow: 2px 10px 16px rgba(0,0,0,.4);
}
.note.pink { background: #f2a9b8; }
.note.blue { background: #a9d4ef; }

.hint {
  font-family: var(--f-type); font-size: 13px; letter-spacing: .08em; color: #8f8272; text-align: center; max-width: 60ch;
}

/* Evidence file (modal) */
dialog.file {
  border: 0; padding: 0; background: transparent; color: var(--ink);
  width: min(640px, calc(100vw - 32px)); max-height: calc(100vh - 40px); overflow: visible;
}
dialog.file::backdrop { background: rgba(8,5,2,.72); }
.folder {
  position: relative; background: var(--manila); padding: 34px 28px 28px;
  box-shadow: 0 30px 70px rgba(0,0,0,.6); max-height: calc(100vh - 40px); overflow: auto;
}
.folder::before {
  content: attr(data-tab); position: absolute; top: -26px; left: 22px; height: 28px; padding: 6px 18px 0;
  background: var(--manila); border-radius: 6px 6px 0 0;
  font-family: var(--f-type); font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: #5b4520;
}
.folder .close {
  position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%;
  border: 2px solid #6b5328; background: transparent; color: #4a381a; font: 700 18px/1 var(--f-body); cursor: pointer;
}
.folder .close:focus-visible { outline: 3px solid var(--stamp); outline-offset: 2px; }
.folder h2 { font-family: var(--f-type); font-weight: normal; font-size: 28px; line-height: 1.1; margin: 0 48px 14px 0; text-wrap: balance; }
.folder .sheet { background: #fbf8f0; padding: 18px 20px; box-shadow: 0 2px 0 rgba(0,0,0,.08); }
.folder dl { margin: 0 0 12px; display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; font-size: 15px; }
.folder dt { color: var(--muted); text-transform: uppercase; font-size: 12px; letter-spacing: .14em; padding-top: 2px; }
.folder dd { margin: 0; min-width: 0; }
.folder p { font-size: 16px; line-height: 1.55; margin: 0 0 12px; max-width: 62ch; }
.folder .watch {
  display: inline-flex; align-items: center; gap: 10px; margin-top: 4px;
  background: var(--ink); color: var(--paper); text-decoration: none; padding: 11px 18px;
  font-family: var(--f-type); letter-spacing: .14em; text-transform: uppercase; font-size: 14px;
}
.folder .watch:focus-visible { outline: 3px solid var(--stamp); outline-offset: 3px; }
.folder .pending { font-family: var(--f-type); color: var(--stamp); letter-spacing: .14em; text-transform: uppercase; font-size: 14px; }
.folder .media { margin: 0 0 14px; background: #000; }
.folder .media img { display: block; width: 100%; max-height: 52vh; object-fit: contain; }
.folder .redline { height: 13px; background: var(--ink); margin: 10px 0; }

@media (prefers-reduced-motion: no-preference) {
  .item.drop { animation: drop .45s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes drop { from { translate: 0 -14px; } to { translate: 0 0; } }
}
</style>
</head>
<body>

<div class="topline">
  <span>Case file <b>No. 001</b></span>
  <span>Subject: <b>Josh Seyse</b> &middot; Status: <b>Open</b></span>
</div>

<div class="frame">
  <div class="viewport" id="viewport">
    <div class="board" id="board">
      <svg class="strings" id="strings" aria-hidden="true"></svg>
      <div class="lamp"></div>
    </div>
  </div>
</div>

<p class="hint">Drag the evidence around. Click any card to open its file. New exhibits are pinned up as each episode drops.</p>

<dialog class="file" id="file" aria-labelledby="file-title">
  <div class="folder" id="folder" data-tab="Evidence">
    <button class="close" id="file-close" aria-label="Close file">&times;</button>
    <div id="file-body"></div>
  </div>
</dialog>

<script>
/* ================================================================
   THE CASE. Add an episode = add one object to EVIDENCE.
   type: "exhibit" (a released episode) or "redacted" (coming soon)
   video: link to the video (YouTube, TikTok, Instagram...)
   thumb: optional image path; YouTube links get a thumbnail automatically
   links: ids this card is tied to with red string
   pos:   { wide:[x,y], tall:[x,y] } board positions (desktop / phone)
   ================================================================ */
const CASE = {
  number: "001",
  subject: "Josh Seyse",
  alias: "JSON",
  opened: "Nov 2026",
  totalDays: 183
};

const EVIDENCE = [
  { id: "case", type: "header",
    pos: { wide: [56, 44], tall: [18, 18] }, w: { wide: 330, tall: 300 }, rot: -1.5 },

  { id: "subject", type: "subject", img: "ironman.jpg",
    caption: "Last seen crossing an Ironman finish line.",
    pos: { wide: [585, 170], tall: [96, 300] }, w: { wide: 250, tall: 230 }, rot: 2 },

  { id: "day1", type: "exhibit", day: 1, title: "Day 1: whosjson.com goes live",
    date: "Nov 2026", video: null, thumb: null, shotText: "WHOSJSON.COM",
    summary: "The subject registers a domain and puts up a single photo. One line of text: \"Six months, all in.\" Motive still unknown.",
    links: ["subject"],
    pos: { wide: [960, 60], tall: [190, 760] }, w: { wide: 250, tall: 220 }, rot: -3 },

  { id: "day2", type: "redacted", day: 2, links: ["day1"],
    pos: { wide: [1050, 560], tall: [24, 1060] }, w: { wide: 210, tall: 190 }, rot: 4 },
  { id: "day3", type: "redacted", day: 3, links: ["day2"],
    pos: { wide: [760, 640], tall: [236, 1260] }, w: { wide: 210, tall: 190 }, rot: -2 },
  { id: "day4", type: "redacted", day: 4, links: ["subject", "day3"],
    pos: { wide: [300, 560], tall: [30, 1460] }, w: { wide: 210, tall: 190 }, rot: 3 },

  { id: "n1", type: "note", text: "6 months.<br>all in.", color: "",
    pos: { wide: [120, 330], tall: [270, 60] }, w: { wide: 160, tall: 150 }, rot: -5 },
  { id: "n2", type: "note", text: "183 days.<br>what is he building??", color: "pink",
    pos: { wide: [1205, 390], tall: [16, 800] }, w: { wide: 170, tall: 150 }, rot: 6 },
  { id: "n3", type: "note", text: "Who's JSON?", color: "blue",
    pos: { wide: [470, 800], tall: [250, 1660] }, w: { wide: 170, tall: 150 }, rot: -3 }
];

const BOARD = { wide: { w: 1400, h: 940 }, tall: { w: 460, h: 1860 } };

/* ---------------- rendering ---------------- */
const board = document.getElementById("board");
const viewport = document.getElementById("viewport");
const svg = document.getElementById("strings");
const exhibits = EVIDENCE.filter(e => e.type === "exhibit");
const latestDay = exhibits.reduce((m, e) => Math.max(m, e.day), 0);
let layout = null, scale = 1;
const els = {};

function ytId(url) {
  if (!url) return null;
  const m = url.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);
  return m ? m[1] : null;
}
function thumbFor(e) {
  if (e.thumb) return e.thumb;
  const id = ytId(e.video);
  return id ? `https://img.youtube.com/vi/${id}/hqdefault.jpg` : null;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function cardHTML(e) {
  switch (e.type) {
    case "header": return `
      <div class="line1">Case file No. ${CASE.number}</div>
      <h1>Who's JSON?</h1>
      <dl>
        <dt>Subject</dt><dd>${esc(CASE.subject)}</dd>
        <dt>Alias</dt><dd>${esc(CASE.alias)}</dd>
        <dt>Opened</dt><dd>${esc(CASE.opened)}</dd>
        <dt>Exhibits</dt><dd>${exhibits.length} logged</dd>
        <dt>Progress</dt><dd>Day ${latestDay} / ${CASE.totalDays}</dd>
        <dt>Status</dt><dd class="open">OPEN</dd>
      </dl>`;
    case "subject": return `
      <div class="photo"><img src="${e.img}" alt="Josh crossing the finish line of his first Ironman" draggable="false"></div>
      <div class="cap">SUBJECT: ${esc(CASE.subject).toUpperCase()}<br>${esc(e.caption)}</div>`;
    case "exhibit": {
      const t = thumbFor(e);
      return `
      <div class="shot">${t ? `<img src="${t}" alt="" draggable="false">` : esc(e.shotText || "FOOTAGE PENDING")}</div>
      <div class="tag"><span>Exhibit ${letter(e)}</span><span>Day ${e.day}</span></div>
      <div class="ttl">${esc(e.title.replace(/^Day \d+:\s*/, ""))}</div>`;
    }
    case "redacted": return `
      <div class="tag">Exhibit ${letter(e)} &middot; Day ${e.day}</div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="stampmark">Classified</div>`;
    case "note": return e.text;
  }
}
function letter(e) {
  const seq = EVIDENCE.filter(x => x.type === "exhibit" || x.type === "redacted").sort((a, b) => a.day - b.day);
  const i = seq.indexOf(e);
  return i < 26 ? String.fromCharCode(65 + i) : "A" + (i - 25);
}
const typeClass = { header: "indexcard", subject: "polaroid", exhibit: "exhibit", redacted: "redacted", note: "note" };
const labelFor = e => ({
  header: "Case summary", subject: "Subject dossier",
  exhibit: `Exhibit ${letter(e)}: ${e.title}`, redacted: `Exhibit ${letter(e)}, Day ${e.day}: classified`,
  note: "Sticky note"
}[e.type]);

EVIDENCE.forEach((e, i) => {
  const el = document.createElement("div");
  el.setAttribute("role", "button");
  el.tabIndex = 0;
  el.className = `item ${typeClass[e.type]} ${e.color || ""} drop`;
  el.style.animationDelay = `${i * 60}ms`;
  el.innerHTML = cardHTML(e);
  el.setAttribute("aria-label", labelFor(e));
  el.dataset.id = e.id;
  if (e.type === "note") el.tabIndex = -1;
  board.insertBefore(el, svg);
  els[e.id] = el;
  e.cur = {};
  makeDraggable(el, e);
});

function place(e) {
  const [x, y] = e.cur[layout];
  const el = els[e.id];
  el.style.left = x + "px"; el.style.top = y + "px";
  el.style.width = e.w[layout] + "px";
  el.style.transform = `rotate(${e.rot}deg)`;
}

function pinPoint(e) {
  const [x, y] = e.cur[layout];
  return [x + e.w[layout] / 2, y + 8];
}

function drawStrings() {
  const { w, h } = BOARD[layout];
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  svg.setAttribute("width", w); svg.setAttribute("height", h);
  let out = "";
  EVIDENCE.forEach(e => (e.links || []).forEach(id => {
    const t = EVIDENCE.find(x => x.id === id); if (!t) return;
    const [x1, y1] = pinPoint(e), [x2, y2] = pinPoint(t);
    const d = Math.hypot(x2 - x1, y2 - y1);
    const sag = Math.min(70, d * 0.12);
    const faint = e.type === "redacted" || t.type === "redacted";
    out += `<path class="${faint ? "faint" : ""}" d="M${x1},${y1} Q${(x1 + x2) / 2},${(y1 + y2) / 2 + sag} ${x2},${y2}"/>`;
  }));
  EVIDENCE.forEach(e => {
    const [x, y] = pinPoint(e);
    out += `<circle class="pin" cx="${x}" cy="${y}" r="7"/><circle class="pin-hi" cx="${x - 2}" cy="${y - 2.5}" r="2"/>`;
  });
  svg.innerHTML = out;
}

function fit() {
  const avail = viewport.parentElement.clientWidth - 28;
  const next = avail < 760 ? "tall" : "wide";
  if (next !== layout) {
    layout = next;
    EVIDENCE.forEach(e => { if (!e.cur[layout]) e.cur[layout] = [...e.pos[layout]]; });
  }
  const { w, h } = BOARD[layout];
  scale = Math.min(1, avail / w);
  board.style.width = w + "px"; board.style.height = h + "px";
  board.style.transform = `scale(${scale})`;
  viewport.style.height = h * scale + "px";
  EVIDENCE.forEach(place);
  drawStrings();
}

/* ---------------- dragging ---------------- */
function makeDraggable(el, e) {
  let start = null, moved = false;
  el.addEventListener("pointerdown", ev => {
    if (ev.button !== 0) return;
    start = { px: ev.clientX, py: ev.clientY, x: e.cur[layout][0], y: e.cur[layout][1] };
    moved = false;
    el.setPointerCapture(ev.pointerId);
  });
  el.addEventListener("pointermove", ev => {
    if (!start) return;
    const dx = (ev.clientX - start.px) / scale, dy = (ev.clientY - start.py) / scale;
    if (!moved && Math.hypot(dx, dy) < 5) return;
    moved = true;
    el.classList.add("dragging");
    const { w, h } = BOARD[layout];
    e.cur[layout] = [
      Math.max(-20, Math.min(w - e.w[layout] + 20, start.x + dx)),
      Math.max(-10, Math.min(h - 80, start.y + dy))
    ];
    place(e); drawStrings();
  });
  const end = () => { start = null; el.classList.remove("dragging"); };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
  el.addEventListener("keydown", ev => {
    if ((ev.key === "Enter" || ev.key === " ") && e.type !== "note") { ev.preventDefault(); openFile(e); }
  });
  el.addEventListener("click", ev => {
    if (moved) { ev.preventDefault(); moved = false; return; }
    if (e.type !== "note") openFile(e);
  });
}

/* ---------------- the evidence file ---------------- */
const dlg = document.getElementById("file");
const folder = document.getElementById("folder");
const body = document.getElementById("file-body");
document.getElementById("file-close").addEventListener("click", () => dlg.close());
dlg.addEventListener("click", ev => { if (ev.target === dlg) dlg.close(); });

function openFile(e) {
  let html = "";
  if (e.type === "header") {
    folder.dataset.tab = `Case No. ${CASE.number}`;
    html = `<h2 id="file-title">Who's JSON?</h2><div class="sheet">
      <dl><dt>Subject</dt><dd>${esc(CASE.subject)}</dd><dt>Opened</dt><dd>${esc(CASE.opened)}</dd>
      <dt>Duration</dt><dd>${CASE.totalDays} days, about six months</dd><dt>Exhibits</dt><dd>${exhibits.length} logged</dd></dl>
      <p>The subject has gone all in for six months and is documenting everything he tries. Each episode is logged here as evidence. Some will work. Some won't. The case stays open until day ${CASE.totalDays}.</p></div>`;
  } else if (e.type === "subject") {
    folder.dataset.tab = "Subject dossier";
    html = `<h2 id="file-title">${esc(CASE.subject)}</h2>
      <div class="media"><img src="${e.img}" alt="Josh crossing the finish line of his first Ironman"></div>
      <div class="sheet"><dl><dt>Alias</dt><dd>${esc(CASE.alias)}</dd><dt>Known for</dt><dd>Ironman finisher</dd>
      <dt>Status</dt><dd>All in</dd></dl>
      <p>${esc(e.caption)} Now trying a new thing on camera, every episode, for six months.</p></div>`;
  } else if (e.type === "exhibit") {
    folder.dataset.tab = `Exhibit ${letter(e)}`;
    const t = thumbFor(e);
    const linked = (e.links || []).map(id => EVIDENCE.find(x => x.id === id)).filter(Boolean)
      .map(x => x.type === "subject" ? "Subject" : `Exhibit ${letter(x)}`).join(", ");
    html = `<h2 id="file-title">${esc(e.title)}</h2>
      ${t ? `<div class="media"><img src="${t}" alt=""></div>` : ""}
      <div class="sheet"><dl><dt>Day</dt><dd>${e.day} of ${CASE.totalDays}</dd><dt>Logged</dt><dd>${esc(e.date)}</dd>
      ${linked ? `<dt>Tied to</dt><dd>${linked}</dd>` : ""}</dl>
      <p>${esc(e.summary)}</p>
      ${e.video ? `<a class="watch" href="${esc(e.video)}" target="_blank" rel="noopener">&#9654; Watch the footage</a>`
                : `<div class="pending">Footage pending</div>`}</div>`;
  } else if (e.type === "redacted") {
    folder.dataset.tab = `Exhibit ${letter(e)}`;
    html = `<h2 id="file-title">Day ${e.day}: Classified</h2><div class="sheet">
      <div class="redline"></div><div class="redline" style="width:78%"></div><div class="redline" style="width:88%"></div>
      <p>This file is sealed until the episode drops. Check back on day ${e.day}.</p></div>`;
  }
  body.innerHTML = html;
  dlg.showModal();
}

window.addEventListener("resize", fit);
fit();
</script>
</body>
</html>
